<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question 💖</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e8,#fff0f7);overflow:hidden}
.card{width:min(92vw,650px);min-height:430px;padding:40px 25px;border-radius:28px;background:rgba(255,255,255,.92);box-shadow:0 15px 45px rgba(255,47,125,.2);text-align:center;position:relative}
h1{color:#ff2f7d;font-size:clamp(28px,6vw,42px);margin:35px 0;white-space:pre-line}
input{width:min(90%,350px);padding:14px;border:2px solid #ff9bc1;border-radius:12px;font-size:18px;text-align:center;outline:none}
button{border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.05)}
.primary{background:#ff4d88;color:white;margin-top:20px}
#game{display:none;min-height:350px}
#buttons{position:relative;height:180px;margin-top:10px}
#yes,#no{position:absolute;top:45px}
#yes{left:28%;background:#ff4d88;color:white}
#no{left:58%;background:#888;color:white}
.option{background:#ff69b4;color:white;margin:10px}
.option2{background:#9b59b6}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
@media(max-width:500px){.card{min-height:400px;padding:25px 15px}#yes{left:20%}#no{left:55%}button{font-size:15px;padding:12px 16px}}
</style>
</head>
<body>
<div class="card">
<div id="nameScreen">
<h1>First... what's your name? 😊</h1>
<input id="nameInput" type="text" placeholder="Enter your name">
<br>
<button class="primary" onclick="startGame()">Continue 💕</button>
</div>

<div id="game">
<h1 id="question"></h1>
<div id="buttons">
<button id="yes" onclick="yesClicked()">Yes ❤️</button>
<button id="no" onclick="noClicked()">No 😐</button>
</div>
<div id="options" style="display:none">
<button class="option" onclick="pookie()">u are my pookie 💕</button>
<button class="option option2" onclick="impress()">impress me 😏</button>
</div>
</div>
</div>

<script>
let name="",noClicks=0;
const nameScreen=document.getElementById("nameScreen");
const game=document.getElementById("game");
const question=document.getElementById("question");
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const buttons=document.getElementById("buttons");
const options=document.getElementById("options");

function startGame(){
 name=document.getElementById("nameInput").value.trim()||"You";
 nameScreen.style.display="none";
 game.style.display="block";
 question.textContent=name+", Do you love me? ❤️";
}

function noClicked(){
 noClicks++;
 no.classList.remove("shake");
 void no.offsetWidth;
 no.classList.add("shake");

 const maxX=Math.max(10,buttons.clientWidth-no.offsetWidth-10);
 const maxY=Math.max(10,buttons.clientHeight-no.offsetHeight-10);
 no.style.left=Math.floor(Math.random()*maxX)+"px";
 no.style.top=Math.floor(Math.random()*maxY)+"px";

 if(noClicks===1) no.textContent="Are you sure? 🤨";
 else if(noClicks===2) no.textContent="I want to become your pookie 🥺";
 else no.style.display="none";
}

function yesClicked(){
 question.textContent="I knew it, "+name+"! 😌❤️\nI also love you!";
 yes.style.display="none";
 no.style.display="none";
 buttons.style.display="none";
 options.style.display="block";
}

function pookie(){
 question.textContent=name+" 💖\nYou are officially my pookie! 🥰";
 options.style.display="none";
}

function impress(){
 question.textContent="Okay "+name+"... 😏\nChallenge accepted! ❤️";
 options.style.display="none";
}
</script>
</body>
</html>
